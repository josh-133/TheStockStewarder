<div class="container">
  <h1>Stock Watchlist</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search ticker..." [(ngModel)]="search" (ngModelChange)="applyFilter()" />
    <button (click)="fetchStocks()">Refresh</button>
  </div>
  <p *ngIf="loading" class="status">Loading...</p>
  <p *ngIf="error" class="error">{{ error }}</p>
  <table *ngIf="!loading && !error">
    <thead>
      <tr><th>Ticker</th><th>Price</th><th>Change %</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let stock of filtered">
        <td class="ticker">{{ stock.ticker }}</td>
        <td>{{ stock.price | number:'1.2-2' }}</td>
        <td [class.gain]="stock.changePercent > 0" [class.loss]="stock.changePercent < 0">{{ stock.changePercent > 0 ? '+' : '' }}{{ stock.changePercent }}%</td>
      </tr>
      <tr *ngIf="filtered.length === 0"><td colspan="3" class="empty">No results.</td></tr>
    </tbody>
  </table>
</div>
